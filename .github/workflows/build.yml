name: Build and test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TGuard.sln

      - name: Build
        run: dotnet build TGuard.sln -c Release --no-restore

      - name: Engine tests
        run: dotnet run --project tests/TGuard.Tests -c Release --no-build

      - name: Publish (win-x64)
        shell: pwsh
        run: |
          $out = "publish"
          dotnet publish src/TGuard.Cli -c Release -r win-x64 --self-contained false -o "$out/cli"
          if (Test-Path src/TGuard.Service/TGuard.Service.csproj) {
            dotnet publish src/TGuard.Service -c Release -r win-x64 --self-contained false -o "$out/service"
          }
          if (Test-Path src/TGuard.App/TGuard.App.csproj) {
            dotnet publish src/TGuard.App -c Release -r win-x64 --self-contained false -o "$out/app"
          }
          Copy-Item scripts/Install-TGuard.ps1 $out/

      - name: CLI smoke tests
        shell: pwsh
        run: |
          ./publish/cli/tguard.exe info
          ./publish/cli/tguard.exe scan "$env:windir\System32\drivers\etc"
          # Authenticode: Microsoft's dotnet.exe is signed, a freshly built test file is not
          $sig = ./publish/cli/tguard.exe signature "$env:ProgramFiles\dotnet\dotnet.exe" | Out-String
          Write-Host $sig
          if ($sig -notmatch '^Valid') { throw 'Authenticode check did not work.' }
          $unsigned = ./publish/cli/tguard.exe signature ./publish/cli/tguard.dll | Out-String
          if ($unsigned -notmatch '^Unsigned') { throw "Unsigned file reported as: $unsigned" }
          $out = ./publish/cli/tguard.exe scan "$env:ProgramFiles\dotnet\dotnet.exe" --all | Out-String
          if ($out -notmatch "CLEAN") { throw 'Signed Microsoft binary was not considered clean.' }
          # false positives: scan a big folder of legit Windows/.NET binaries
          $runtime = Get-ChildItem "$env:ProgramFiles\dotnet\shared\Microsoft.NETCore.App" | Sort-Object Name | Select-Object -Last 1
          $sw = [Diagnostics.Stopwatch]::StartNew()
          ./publish/cli/tguard.exe scan "$env:windir\System32\WindowsPowerShell" $runtime.FullName "$env:ProgramFiles\dotnet\dotnet.exe"
          $code = $LASTEXITCODE
          Write-Host "False-positive scan took $([int]$sw.Elapsed.TotalSeconds)s"
          $global:LASTEXITCODE = $code
          if ($LASTEXITCODE -ne 0) { throw 'False positives on legit Windows/.NET files.' }
          # signature update from the public feeds (may fail if a feed needs an API key, but must not crash)
          ./publish/cli/tguard.exe update
          if ($LASTEXITCODE -gt 1) { throw 'Update crashed.' }
          $global:LASTEXITCODE = 0

      - name: Service integration tests
        shell: pwsh
        run: ./scripts/ci-service-test.ps1

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $version = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" installer\TGuard.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }
          Get-ChildItem publish\TGuard-Setup-*.exe | ForEach-Object { "{0} {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Installer test (silent install, service, uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem publish\TGuard-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LANG=en' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup exited with $($p.ExitCode)" }
          $svc = Get-Service TGuard -ErrorAction Stop
          for ($i = 0; $i -lt 20 -and $svc.Status -ne 'Running'; $i++) { Start-Sleep 1; $svc.Refresh() }
          if ($svc.Status -ne 'Running') { throw "Service is $($svc.Status)" }
          $exe = Join-Path $env:ProgramFiles 'TGuard\app\TGuard.exe'
          if (-not (Test-Path $exe)) { throw 'App was not installed.' }
          $pipe = New-Object System.IO.Pipes.NamedPipeClientStream('.', 'TGuard.Service.v1', [System.IO.Pipes.PipeDirection]::InOut)
          $pipe.Connect(10000)
          $w = New-Object System.IO.StreamWriter($pipe); $w.AutoFlush = $true
          $r = New-Object System.IO.StreamReader($pipe)
          $w.WriteLine('{"cmd":"status"}')
          $status = $r.ReadLine() | ConvertFrom-Json
          $pipe.Dispose()
          if (-not $status.ok) { throw 'Installed service did not answer.' }
          Write-Host "Installed service: $($status.data | ConvertTo-Json -Compress)"
          $acl = (Get-Acl "$env:ProgramData\TGuard").Access | Where-Object { $_.IdentityReference -like '*Users*' }
          if ($acl.FileSystemRights -match 'Write|Modify|FullControl') { throw 'Users can write to ProgramData\TGuard.' }
          $u = Start-Process (Join-Path $env:ProgramFiles 'TGuard\unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep 3
          if (Get-Service TGuard -ErrorAction SilentlyContinue) { throw 'Service still exists after uninstall.' }
          if (Test-Path $exe) { throw 'App still exists after uninstall.' }
          Write-Host 'Install / uninstall OK'

      - name: UI selftest (screenshots)
        shell: pwsh
        run: |
          foreach ($lang in @("pt", "en")) {
            $args = @("--selftest", "$PWD/screenshots/$lang")
            if ($lang -eq "en") { $args += "--en" }
            $p = Start-Process -FilePath ./publish/app/TGuard.exe -ArgumentList $args -Wait -PassThru
            if (Test-Path "screenshots/$lang/error.txt") { Get-Content "screenshots/$lang/error.txt" }
            if (Test-Path "screenshots/$lang/binding-errors.txt") { Get-Content "screenshots/$lang/binding-errors.txt" }
            if ($p.ExitCode -ne 0) { throw "UI selftest ($lang) failed with exit code $($p.ExitCode)" }
          }
          Get-ChildItem -Recurse screenshots

      - name: Push screenshots to ci-screenshots branch
        if: always() && hashFiles('screenshots/**') != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          Set-Location screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for $sha"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14

      - name: Push installer to ci-builds branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-builds | Out-Null
          Copy-Item publish\TGuard-Setup-*.exe ci-builds\
          Set-Location ci-builds
          git init -q -b ci-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Installer for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-builds

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $setup = Get-ChildItem publish\TGuard-Setup-*.exe | Select-Object -First 1
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $setup.FullName --clobber }
          else { gh release create $tag $setup.FullName --title "TGuard $($tag.TrimStart('v'))" --notes-file installer/RELEASE_NOTES.md }

      - uses: actions/upload-artifact@v4
        with:
          name: TGuard-win-x64
          path: publish/
          retention-days: 30
