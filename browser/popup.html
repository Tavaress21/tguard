<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  body { width: 320px; background: #fff; }
  header { background: var(--navy); color: #fff; padding: 16px 18px; display: flex; align-items: center; gap: 12px; }
  header img { width: 32px; height: 32px; }
  header strong { font-size: 18px; font-weight: 800; display: block; }
  header span { font-size: 12px; opacity: .8; }
  .state { margin: 14px 16px 6px; border-radius: 16px; padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .state.on { background: var(--good-soft); }
  .state.off { background: var(--bad-soft); }
  .state b { font-size: 15px; }
  .state.on b { color: var(--good); }
  .state.off b { color: var(--bad); }
  .state button { padding: 6px 14px; font-size: 13px; }
  .site { margin: 8px 16px; font-size: 13px; color: var(--muted); }
  .site b { color: var(--ink); }
  dl { margin: 6px 16px; display: grid; grid-template-columns: 1fr auto; row-gap: 8px; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; text-align: right; }
  .actions { display: flex; gap: 8px; padding: 12px 16px 16px; }
  .actions > * { flex: 1; text-align: center; padding: 8px 10px; font-size: 13px; }
  footer { border-top: 1px solid var(--line); padding: 10px 16px; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <img src="icons/icon48.png" alt="">
  <div><strong>TGuard</strong><span id="subtitle"></span></div>
</header>
<div class="state" id="state"><b id="stateText"></b><button class="secondary" id="toggle"></button></div>
<div class="site" id="site"></div>
<dl>
  <dt id="listsLabel"></dt><dd id="lists"></dd>
  <dt id="blockedLabel"></dt><dd id="blocked"></dd>
  <dt id="updatedLabel"></dt><dd id="updated"></dd>
</dl>
<div class="actions">
  <button class="secondary" id="update"></button>
  <a class="button" id="report" target="_blank" rel="noopener"></a>
</div>
<footer id="footer"></footer>
<script type="module" src="popup.js"></script>
</body>
</html>
